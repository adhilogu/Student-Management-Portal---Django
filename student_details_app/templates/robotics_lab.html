{% extends 'base.html' %}
{% load static %}
{% block title %}Robotics Lab{% endblock %}

{% block content %}
    <style>
        /* Container for the photo gallery */
        .photo-gallery {
            display: flex;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            height: 200px; /* Adjust height as needed */
            position: relative;
            /* Hide overflow to ensure smooth scrolling */
            overflow: hidden;
        }

        /* Individual photo items */
        .photo-gallery img {
            height: 100%;
            width: auto;
            display: inline-block;
        }

        /* Animation for scrolling */
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .photo-gallery-wrapper {
            display: flex;
            width: 200%; /* Ensure width is double to cover continuous scrolling */
            animation: scroll 20s linear infinite;
        }
    </style>

    <h1 style="font-size: 3em; color: #000F5A; font-weight: bold; " >Robotics Lab</h1>

    <!-- Photo Gallery -->
    <div class="photo-gallery">
        <div class="photo-gallery-wrapper">
            <!-- Add your photos here -->
            <img src="{% static 'images/rb1.jpg' %}" alt="Photo 1">
            <img src="{% static 'images/rb2.jpg' %}" alt="Photo 2">
            <img src="{% static 'images/rb3.jpg' %}" alt="Photo 3">
            <img src="{% static 'images/rb4.jpg' %}" alt="Photo 4">
            <img src="{% static 'images/rb5.jpg' %}" alt="Photo 5">
            <!-- Repeat images to ensure continuous scroll -->
            <img src="{% static 'images/rb1.jpg' %}" alt="Photo 1">
            <img src="{% static 'images/rb2.jpg' %}" alt="Photo 2">
            <img src="{% static 'images/rb3.jpg' %}" alt="Photo 3">
            <img src="{% static 'images/rb4.jpg' %}" alt="Photo 4">
            <img src="{% static 'images/rb5.jpg' %}" alt="Photo 5">
        </div>
    </div>

    <!-- Other content for the page -->

{% endblock %}
